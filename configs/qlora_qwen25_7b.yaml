# Single source of truth for Qwen2.5-7B-Instruct QLoRA fine-tuning & evaluation.
# Tuned for free Google Colab T4 (16 GB VRAM) / Kaggle (P100/T4).

model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  max_seq_length: 1536
  trust_remote_code: false

data:
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  test_file: "data/processed/test.jsonl"
  completion_only_loss: true

qlora:
  load_in_4bit: true
  quant_type: "nf4"
  use_double_quant: true
  # "auto" selects bfloat16 on Ampere+ (A100/L4) and float16 on Turing/Pascal (Colab T4 / Kaggle P100).
  compute_dtype: "auto"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "outputs/qwen2.5-7b-sanad-qlora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.08
  weight_decay: 0.01
  max_grad_norm: 0.3
  optim: "paged_adamw_8bit"
  gradient_checkpointing: true
  logging_steps: 5
  eval_steps: 15
  save_steps: 15
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  seed: 42

tracking:
  default_tracker: "wandb"
  wandb_project: "qwen25-sanad-arabic-qlora"
  mlflow_experiment: "qwen25-sanad-arabic-qlora"
  run_name: "qwen25-7b-sanad-qlora-r16"

eval:
  output_dir: "outputs/eval"
  max_new_tokens: 256
  do_sample: false
  temperature: 0.0
  batch_size: 4
